[project]
name = "batteri"
version = "0.1.0"
description = "Batteristatus för alla enheter på Apple-kontot, från Hitta"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyicloud==2026.11.2",
    "rich>=15.0.0",
]

[project.scripts]
batteri = "batteri.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
